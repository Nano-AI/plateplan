<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlatePlan</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div class="phone">
    <header class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M16 16H3A13 13 0 0 1 16 3z" fill="#d2404f"/><path d="M16 16V3a13 13 0 0 1 13 13z" fill="#d9822b"/><path d="M16 16h13a13 13 0 0 1-13 13z" fill="#7b4ea0"/><path d="M16 16v13A13 13 0 0 1 3 16z" fill="#3c8a4a"/><circle cx="16" cy="16" r="5" fill="#f7f9f2"/></svg>
      <span>PlatePlan</span>
    </header>
    <main id="screen" class="screen" tabindex="-1"></main>
    <nav id="tabs" class="tabs" aria-label="Sections" hidden>
      <button type="button" data-action="view" data-arg="plan"><span aria-hidden="true">🗓️</span>Plan</button>
      <button type="button" data-action="view" data-arg="groceries"><span aria-hidden="true">🛒</span>Groceries</button>
      <button type="button" data-action="view" data-arg="profile"><span aria-hidden="true">🙂</span>Profile</button>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <noscript><p class="noscript">PlatePlan needs JavaScript. Serve the folder with <code>python3 -m http.server</code> and open it in a browser.</p></noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
